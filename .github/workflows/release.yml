name: Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          ver=$(grep -oP '__version__ = "\K[^"]+' src/kraken_tool/__init__.py)
          tag="v$ver"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null && [ "${GITHUB_REF}" != "refs/tags/$tag" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"   # already released; bump __version__ to release again
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.publish == 'true'
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q
      - run: python packaging/build.py
      - name: Smoke test binary
        shell: bash
        run: ./dist/kraken-tool-* --version
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}
          path: dist/*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cp packaging/71-kraken-tool.rules dist/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: kraken-tool ${{ needs.version.outputs.tag }}
          files: dist/*
          generate_release_notes: true
