[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kraken-tool"
dynamic = ["version"]
description = "Diagnose and repair the LCD display controller of NZXT Kraken Elite AIO coolers"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
  "hidapi>=0.14",
  "pyusb>=1.2",
  "Pillow>=10",
  "libusb-package; sys_platform == 'win32' or sys_platform == 'cygwin'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6"]

[project.scripts]
kraken-tool = "kraken_tool.cli:main"

[tool.setuptools.dynamic]
version = { attr = "kraken_tool.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
